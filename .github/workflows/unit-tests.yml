name: Run Unit Tests
on:
  pull_request:
    branches: [main, release/**]
    paths:
      - 'client/**'
      - 'server/**'
      - 'desktop/**'
jobs:
  test-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Dependencies
        run: npm install

      - name: Run Client Tests
        run: npx vitest run

  test-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Dependencies
        run: npm install

      - name: Run Server Tests
        run: npx vitest run

  test-desktop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm install
        env:
          # The desktop tests mock Electron entirely, so skip the ~100MB binary download.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Run Desktop Tests
        run: npx vitest run --dir desktop