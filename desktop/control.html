<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<title>Job Tracker Launcher</title>
	<style>
		:root {
			--background: #12161d;
			--surface: #1b232b;
			--border: #2f3a44;
			--text: #d5dde5;
			--text-dim: #8b98a5;
			--green: #2ecc71;
			--red: #e74c3c;
			--accent: #3498db;
		}
		* { box-sizing: border-box; margin: 0; }
		body {
			background: var(--background);
			color: var(--text);
			font-family: "Segoe UI", system-ui, sans-serif;
			height: 100vh;
			display: flex;
			flex-direction: column;
		}
		header {
			display: flex;
			align-items: center;
			gap: 14px;
			padding: 12px 16px;
			background: var(--surface);
			border-bottom: 1px solid var(--border);
		}
		h1 { font-size: 15px; font-weight: 600; margin-right: auto; }
		.status-item { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--text-dim); }
		.status-dot {
			width: 10px; height: 10px; border-radius: 50%;
			background: var(--red);
			transition: background 0.3s;
		}
		.status-dot.up { background: var(--green); }
		button {
			background: transparent;
			color: var(--text);
			border: 1px solid var(--border);
			border-radius: 6px;
			padding: 6px 14px;
			font-size: 13px;
			cursor: pointer;
		}
		button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
		button:disabled { opacity: 0.4; cursor: default; }
		button.primary { border-color: var(--accent); color: var(--accent); font-weight: 600; }

		#config-panel {
			display: none;
			background: var(--surface);
			border-bottom: 1px solid var(--border);
			padding: 14px 16px;
		}
		#config-panel.open { display: block; }
		#config-panel .config-grid {
			display: grid;
			grid-template-columns: 170px 1fr;
			gap: 8px 12px;
			align-items: center;
			max-width: 720px;
		}
		#config-panel label { font-size: 12.5px; color: var(--text-dim); }
		#config-panel input, #config-panel select {
			background: var(--background);
			color: var(--text);
			border: 1px solid var(--border);
			border-radius: 5px;
			padding: 6px 9px;
			font-size: 12.5px;
			font-family: Consolas, monospace;
		}
		#config-panel input:focus, #config-panel select:focus { outline: none; border-color: var(--accent); }
		#config-panel input:disabled, #config-panel select:disabled { opacity: 0.45; cursor: default; }
		#config-panel .field-row { display: flex; gap: 8px; align-items: center; }
		#config-panel .field-row > select, #config-panel .field-row > input { flex: 1; }
		#config-panel button.mini { padding: 5px 11px; font-size: 12px; white-space: nowrap; }
		#config-panel a.config-hint { text-decoration: none; }
		#config-panel a.config-hint:hover { color: var(--accent); }
		#config-panel .config-actions { margin-top: 12px; display: flex; gap: 10px; align-items: center; }
		#config-panel .config-hint { font-size: 12px; color: var(--text-dim); }

		#log-console {
			flex: 1;
			overflow-y: auto;
			padding: 12px 16px;
			font-family: Consolas, "Cascadia Mono", monospace;
			font-size: 12px;
			line-height: 1.6;
			white-space: pre-wrap;
			word-break: break-all;
		}
		#log-console .log-line { color: var(--text-dim); }
		#log-console .log-line.error-line { color: var(--red); }
		#log-console .log-line.launcher-line { color: var(--accent); }
	</style>
</head>
<body>
	<header>
		<h1>Job Tracker</h1>
		<div class="status-item"><span id="server-dot" class="status-dot"></span>Server</div>
		<div class="status-item"><span id="ollama-dot" class="status-dot"></span>Ollama</div>
		<button id="config-button">Config</button>
		<button id="start-button">Start</button>
		<button id="stop-button" disabled>Stop</button>
		<button id="open-app-button" class="primary" disabled>Open App</button>
	</header>

	<section id="config-panel">
		<div class="config-grid">
			<label for="google-client-id">Google Client ID</label>
			<input id="google-client-id" spellcheck="false" placeholder="xxxx.apps.googleusercontent.com" />
			<label for="google-client-secret">Google Client Secret</label>
			<input id="google-client-secret" type="password" spellcheck="false" />
			<label for="google-redirect-uri">OAuth Redirect URI</label>
			<input id="google-redirect-uri" spellcheck="false" />
			<label for="session-secret">Session Secret</label>
			<input id="session-secret" type="password" spellcheck="false" placeholder="leave empty to auto-generate" />
			<label for="server-port">Port</label>
			<input id="server-port" spellcheck="false" placeholder="3001" />
			<label for="ollama-model">Classification model</label>
			<div class="field-row">
				<select id="ollama-model"></select>
				<button type="button" id="refresh-models-button" class="mini" title="Refresh model list">⟳</button>
			</div>
			<span></span>
			<span class="config-hint">Not sure? <strong>qwen2.5:7b</strong> is the recommended default — select it above if installed, or download it below (~4.7 GB).</span>
			<label for="pull-model-input">Download a model</label>
			<div class="field-row">
				<input id="pull-model-input" spellcheck="false" placeholder="e.g. qwen2.5:7b" />
				<button type="button" id="pull-model-button" class="mini">Download</button>
			</div>
			<span></span>
			<a id="browse-models-link" class="config-hint" href="#">Browse models on ollama.com ↗</a>
		</div>
		<div class="config-actions">
			<button id="save-config-button" class="primary">Save</button>
			<span class="config-hint">Saved to server/.env — the server restarts automatically if it is running.</span>
		</div>
	</section>

	<div id="log-console"></div>
	<script src="dist/control.js"></script>
</body>
</html>
